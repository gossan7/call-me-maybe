[project]
name = "call-me-maybe"
version = "0.1.0"
description = "Function calling with constrained decoding"
requires-python = ">=3.10"
dependencies = [
    "torch>=2.0.0",
    "transformers>=4.40.0",
    "huggingface-hub>=0.20.0",
    "pydantic>=2.13.3",
    "dotenv>=0.9.9",
    "mypy>=1.20.1",
    "flake8>=7.3.0",
    "regex>=2026.4.4",
    "types-regex>=2026.4.4.20260408",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]
